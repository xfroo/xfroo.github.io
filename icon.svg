<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2352"/>
      <stop offset="1" stop-color="#0b0f19"/>
    </linearGradient>
    <radialGradient id="nebula" cx=".3" cy=".75" r=".6">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rock" cx=".35" cy=".35" r=".75">
      <stop offset="0" stop-color="#ffa07a"/>
      <stop offset=".5" stop-color="#e0483a"/>
      <stop offset="1" stop-color="#5a1a1a"/>
    </radialGradient>
    <linearGradient id="tail" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5028" stop-opacity="0"/>
      <stop offset=".75" stop-color="#ff6e32" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffc878" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f69b0"/>
      <stop offset=".45" stop-color="#58a6ff"/>
      <stop offset=".6" stop-color="#a9d0ff"/>
      <stop offset="1" stop-color="#1f4a80"/>
    </linearGradient>
    <linearGradient id="cockpit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6ecff"/>
      <stop offset="1" stop-color="#1b2a44"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shipGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#nebula)"/>

  <g fill="#ffffff">
    <circle cx="70" cy="90" r="3" opacity=".8"/>
    <circle cx="140" cy="200" r="2" opacity=".5"/>
    <circle cx="430" cy="380" r="3" opacity=".7"/>
    <circle cx="380" cy="470" r="2" opacity=".5"/>
    <circle cx="60" cy="300" r="2.5" opacity=".6"/>
    <circle cx="250" cy="60" r="2" opacity=".6"/>
    <circle cx="460" cy="250" r="2" opacity=".5"/>
    <circle cx="110" cy="440" r="2.5" opacity=".7"/>
  </g>

  <!-- Meteor with tail -->
  <path d="M470 18 L300 178 L362 236 Z" fill="url(#tail)"/>
  <path d="M330 120 L372 132 L398 168 L400 212 L376 248 L332 262 L292 248 L268 210 L272 166 L296 132 Z" fill="url(#rock)" stroke="#ffaa8c" stroke-opacity=".55" stroke-width="5"/>
  <circle cx="318" cy="180" r="16" fill="#3c0a0a" opacity=".38"/>
  <circle cx="360" cy="214" r="11" fill="#3c0a0a" opacity=".38"/>
  <circle cx="352" cy="160" r="8" fill="#3c0a0a" opacity=".38"/>

  <!-- Ship -->
  <circle cx="190" cy="350" r="120" fill="url(#shipGlow)"/>
  <g transform="translate(190 340) rotate(-6) scale(4.4)">
    <path d="M-5.5 14 Q0 40 5.5 14 Z" fill="url(#flame)"/>
    <path d="M-7 0 L-17 15 L-16 19 L-6 15 Z" fill="#2f69b0"/>
    <path d="M7 0 L17 15 L16 19 L6 15 Z" fill="#2f69b0"/>
    <path d="M0 -24 C9 -14 10 4 7 15 L-7 15 C-10 4 -9 -14 0 -24 Z" fill="url(#hull)"/>
    <rect x="-1.2" y="5" width="2.4" height="11" fill="#1f4a80"/>
    <rect x="-5" y="14.5" width="10" height="3" fill="#262c3a"/>
    <ellipse cx="0" cy="-7" rx="3.8" ry="6.2" fill="url(#cockpit)"/>
    <ellipse cx="-1.2" cy="-9.5" rx="1.1" ry="2.2" fill="#ffffff" opacity=".75" transform="rotate(-17 -1.2 -9.5)"/>
  </g>
</svg>
